name: TAIFEX Data to Release

on:
  schedule:
    # 每天台灣時間 23:00 執行 (23:00 - 8 = UTC 15:00)
    - cron: '0 15 * * *' 
  workflow_dispatch: # 保留手動觸發按鈕，方便測試

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Downloader
        run: python download_data.py

      - name: Get Archive Info
        id: info
        # 強制使用台灣時區來計算月份標籤，避免 UTC 導致跨日誤差
        run: |
          export TZ="Asia/Taipei"
          echo "month=data-$(date +'%Y-%m')" >> $GITHUB_OUTPUT
          echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload to Monthly Release
        uses: softprops/action-gh-release@v2
        if: hashFiles('data/*.gz') != ''
        with:
          # 這裡決定了歸檔邏輯：同一個月份會推送到同一個 Tag 下
          tag_name: ${{ steps.info.outputs.month }}
          name: Market Data Archive - ${{ steps.info.outputs.month }}
          body: "Last updated on ${{ steps.info.outputs.today }}. This release contains all tick data for the month."
          files: data/*.gz
          append_body: false # 設為 false 則每次只顯示最後更新日期，不會讓描述變超長
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}